name: Publish to npm

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'skills/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Trusted Publishing via OIDC — no NPM_TOKEN secret needed.
# 1. Package must exist on npmjs.com first
# 2. Configure at npmjs.com → package settings → Trusted Publisher:
#    - Provider: GitHub Actions
#    - Repo: Aidas-dev/k8s-agent-skills
#    - Workflow filename: publish.yml
#    - Environment: (leave blank)
#    - Allowed actions: npm publish
# 3. That's it — OIDC handles auth automatically.

permissions:
  contents: write
  id-token: write          # Required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # 24.x ships npm 11.5.1+ (required for OIDC)
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC needs 11.5.1+)
        run: npm install -g npm@latest

      - name: Read current version
        id: version
        run: echo "current=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        continue-on-error: true
        run: |
          published=$(npm view ${{ github.event.repository.name }}@${{ steps.version.outputs.current }} version 2>/dev/null || echo "")
          if [ "$published" = "${{ steps.version.outputs.current }}" ]; then
            echo "Version ${{ steps.version.outputs.current }} already published"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${{ steps.version.outputs.current }} not published yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-bump version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          npm version ${{ inputs.bump }} -m "chore: bump version to %s [skip ci]"
          echo "new_version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
        id: bump

      # OIDC auth is automatic — npm CLI detects ACTIONS_ID_TOKEN_REQUEST_URL
      # and exchanges the OIDC token for an npm auth token at publish time.
      # No NODE_AUTH_TOKEN / NPM_TOKEN needed.
      - name: Publish to npm with trusted publishing + provenance
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        run: npm publish --provenance --access public

      - name: Push version bump commit back
        if: github.event_name == 'workflow_dispatch' && steps.bump.outputs.new_version != ''
        run: git push
