name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Serialize publishes — prevents a tag push and workflow_dispatch racing.
concurrency:
  group: npm-publish
  cancel-in-progress: false

# Trusted Publishing via OIDC — no NPM_TOKEN secret needed.
# 1. Package must exist on npmjs.com first
# 2. Configure at npmjs.com → package settings → Trusted Publisher:
#    - Provider: GitHub Actions
#    - Repo: Aidas-dev/k8s-agent-skills
#    - Workflow filename: publish.yml
#    - Environment: (leave blank)
#    - Allowed actions: npm publish
# 3. That's it — OIDC handles auth automatically.

permissions:
  contents: write
  id-token: write          # Required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26   # 26.x ships npm 11.5.1+ (required for OIDC)
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC needs 11.5.1+)
        run: npm install -g npm@latest

      # Tag path: package.json version must already match the tag (use `npm version` to create it).
      # Dispatch path: bump first, then publish the bumped version.
      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          npm version ${{ inputs.bump }} -m "chore: bump version to %s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        id: bump

      - name: Publish to npm with trusted publishing + provenance
        run: npm publish --provenance --access public

      - name: Push version bump commit back
        if: github.event_name == 'workflow_dispatch' && steps.bump.outputs.version != ''
        run: git push
