name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          NOTES_FILE=/tmp/release-notes-${{ github.ref_name }}.md
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-decorate "${PREV_TAG}..${GITHUB_REF_NAME}" 2>/dev/null \
              | sed 's/^/* /' > "$NOTES_FILE"
          else
            echo "Initial release ${{ github.ref_name }}" > "$NOTES_FILE"
          fi
          echo "notes-file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
        id: notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.notes-file }}" \
            --verify-tag
