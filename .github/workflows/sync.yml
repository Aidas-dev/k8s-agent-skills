name: Sync from Gitea

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch from Gitea and push to GitHub
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git remote add gitea https://aidmantas:${GITEA_TOKEN}@git.kubexa.tech/Aidas/k8s-agent-skills.git
          git fetch gitea main
          LOCAL=$(git rev-parse main)
          REMOTE=$(git rev-parse FETCH_HEAD)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Gitea ahead. Syncing..."
            git push origin FETCH_HEAD:main
            echo "synced=true" >> "$GITHUB_ENV"
          else
            echo "Already in sync."
            echo "synced=false" >> "$GITHUB_ENV"
          fi

      - name: Trigger publish
        if: env.synced == 'true'
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches \
            -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
