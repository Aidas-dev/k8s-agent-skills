name: Sync from Gitea

# Syncs GitHub mirror with canonical Gitea source.
# Triggered by: schedule (every 5min), manual, or after publish workflow

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch from Gitea and push to GitHub
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git remote add gitea https://aidmantas:${GITEA_TOKEN}@git.kubexa.tech/Aidas/k8s-agent-skills.git
          git fetch gitea main
          LOCAL=$(git rev-parse main)
          REMOTE=$(git rev-parse FETCH_HEAD)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "Gitea ahead. Syncing..."
            git push origin FETCH_HEAD:main
          else
            echo "Already in sync."
          fi
